[project]
name = "self-healing-iam-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "kubernetes>=36.0.3",
    "langchain-anthropic>=1.7.6",
    "langgraph>=1.2.14",
    "mcp>=2.2.0",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.0.1",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
tracing = [
    "arize-phoenix>=20.21.0",
    "arize-phoenix-otel>=0.17.2",
    "openinference-instrumentation-langchain>=0.1.79",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
